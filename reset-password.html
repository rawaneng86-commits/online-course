<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset-passowrd</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="fonts/BeVietnamPro-Black.ttf">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="css/login.css">
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">

</head>
<body>
    <section class="sec-reset-pass">

        <div class="reset-form">
          <h2>Reset Password</h2>
          <p>Please enter your email to reset your password.</p>

        <form id="resetForm">
          <div class="input-group">
            <input type="email" class="email" placeholder="Enter your email" required>
          </div>
          <button type="submit" class="btn btn-success">Send Reset Link</button>
          <p class="error-msg"></p>
          <p class="success-msg">✅ A password reset link has been sent to your email!</p>
        </form>


          
        </div>
      </section>
            



    <script src="js/jQuery.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/reset-password.js"></script>
    <script src="js/darkmode.js"></script>
</body>
</html>
